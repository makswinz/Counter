name: Feature request
description: Something Counter should be able to do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Before writing: a few things are settled by design and are listed under
        [Things that are decided](../blob/main/CONTRIBUTING.md#things-that-are-decided).
        No telemetry, no accounts, no network calls, and no third-party UI framework.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The problem rather than the solution. It often has a better answer than the one you had in mind.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you think would solve it
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
